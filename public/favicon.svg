<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- webterm: a terminal prompt (>_) in a browser window. Colors from the default theme. -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#282c34"/>
  <!-- browser toolbar: a dot and the address bar -->
  <path d="M2 18 V16 Q2 2 16 2 H48 Q62 2 62 16 V18 Z" fill="#363c48"/>
  <circle cx="12" cy="10" r="3" fill="#7aa6da"/>
  <rect x="19" y="6.5" width="36" height="7" rx="3.5" fill="#20232a"/>
  <!-- prompt -->
  <path d="M15 29 L27 38 L15 47" fill="none" stroke="#7aa6da" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="31" y="43" width="18" height="6" rx="2" fill="#e8ecf2"/>
  <!-- light rim, so the dark tile stands out on dark tab bars -->
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="13.25" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
</svg>
