<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#181825" />
    <title>webterm — sign in</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #1e1e2e;
        color: #cdd6f4;
        font-family: system-ui, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 16px;
        box-sizing: border-box;
      }
      form {
        width: 100%;
        max-width: 340px;
        background: #181825;
        border: 1px solid #313244;
        border-radius: 12px;
        padding: 28px 24px;
        box-sizing: border-box;
      }
      h1 {
        margin: 0 0 20px;
        font: 600 20px ui-monospace, Menlo, Consolas, monospace;
        color: #a6e3a1;
      }
      h1::before { content: '> '; color: #585b70; }
      label {
        display: block;
        margin: 14px 0 6px;
        font-size: 13px;
        color: #a6adc8;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        font-size: 16px; /* >= 16px prevents iOS zoom-on-focus */
        color: #cdd6f4;
        background: #1e1e2e;
        border: 1px solid #45475a;
        border-radius: 8px;
        outline: none;
      }
      input:focus { border-color: #89b4fa; }
      button {
        width: 100%;
        margin-top: 22px;
        padding: 11px;
        font: 600 15px system-ui, sans-serif;
        color: #1e1e2e;
        background: #89b4fa;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      button:active { background: #74a0e8; }
      #error {
        display: none;
        margin: 0 0 4px;
        padding: 8px 10px;
        font-size: 13px;
        color: #f38ba8;
        background: #f38ba822;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <form method="post" action="/login">
      <h1>webterm</h1>
      <p id="error" role="alert"></p>
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">Sign in</button>
    </form>
    <script>
      const messages = {
        invalid: 'Incorrect username or password.',
        locked: 'Too many failed attempts. Try again in 15 minutes.',
      };
      const code = new URLSearchParams(location.search).get('error');
      if (messages[code]) {
        const el = document.getElementById('error');
        el.textContent = messages[code];
        el.style.display = 'block';
      }
    </script>
  </body>
</html>
